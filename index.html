<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MINES Game</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="game-container">
      <h1 class="game-title">MINES</h1>

      <!-- Только кнопка смены фона -->
      <div class="field-selector">
        <button id="changeBgBtn" class="bg-icon-button" title="Сменить фон">
          🎨
        </button>
      </div>

      <!-- Игровое поле -->
      <div class="game-grid" id="gameGrid"></div>

      <!-- Кнопки управления -->
      <div class="action-buttons">
        <button class="signal-button" id="getSignalBtn">ПРОГНОЗ</button>
        <button class="play-button">ИГРАТЬ</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>

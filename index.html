<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MINES Game</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="game-container">
      <h1 class="game-title">MINES</h1>

      <!-- Блок выбора размера + иконка смены фона -->
      <div class="field-selector">
        <button data-size="3">3x3</button>
        <button data-size="5" class="active">5x5</button>
        <button data-size="7">7x7</button>
        <button data-size="10">10x10</button>

        <!-- Кнопка смены фона с эмоджи 🎨 -->
        <button id="changeBgBtn" class="bg-icon-button" title="Сменить фон">
          🎨
        </button>
      </div>

      <!-- Игровое поле -->
      <div class="game-grid" id="gameGrid"></div>

      <!-- Кнопка "ПОЛУЧИТЬ СИГНАЛ" -->
      <button class="signal-button" id="getSignalBtn">ПОЛУЧИТЬ СИГНАЛ</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
